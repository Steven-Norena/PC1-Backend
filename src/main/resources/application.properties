spring.application.name=pc1
server.servlet.context-path=/api/v1

# Conexión a Base de Datos parametrizada
spring.datasource.url=jdbc:postgresql://\({DB_HOST:localhost}:\){DB_PORT:5432}/${DB_NAME:pc1}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración JWT
jwt.secret=${JWT_SECRET:3cfa498a91f8427f98d407639e26210f1c3f2d90a782b1897cdae3d0859c03b1}
jwt.expiration-access=${JWT_EXPIRATION_ACCESS:86400000}
